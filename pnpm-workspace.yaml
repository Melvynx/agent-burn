packages:
  - apps/*
  - docs
  - packages/*

catalogMode: strict

catalogs:
  docs:
    '@tailwindcss/vite': 4.3.3
    '@tanstack/react-router': 1.170.17
    '@tanstack/react-start': 1.168.27
    '@types/mdx': ^2.0.14
    '@types/react-dom': 19.2.4
    '@vitejs/plugin-react': 6.0.3
    cnfast: ^0.1.0
    fumadocs-core: 16.15.0
    fumadocs-mdx: 15.3.1
    fumadocs-ui: 16.15.0
    lucide-react: 1.23.0
    nitro: 3.0.260610-beta
    react: 19.2.7
    react-dom: 19.2.7
    tailwindcss: 4.3.3
    tslib: 2.8.1
    typescript: 6.0.3
    vite: 8.1.3
  lint:
    publint: ^0.3.12
  llm-docs:
    '@gunshi/docs': ^0.31.0
  release:
    bumpp: ^11.1.0
    changelogithub: ^14.0.0
    pkg-pr-new: ^0.0.75
  runtime:
    '@antfu/utils': ^9.2.1
    '@praha/byethrow': ^0.11.2
    ansi-escapes: ^7.0.0
    arkregex: ^0.0.5
    get-stdin: ^9.0.0
    gunshi: ^0.31.0
    picospinner: ^3.0.0
    type-fest: ^4.41.0
    valibot: ^1.1.0
    xdg-basedir: ^5.1.0
  types:
    '@types/node': ^24.10.1
    '@types/react': ^19.1.13

enablePrePostScripts: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@tanstack/react-router'
  - '@tanstack/react-start'
  - '@tailwindcss/vite'
  - fumadocs-core
  - fumadocs-mdx
  - fumadocs-ui
  - nitro
  - tailwindcss
  - vite

# Security settings for supply chain attack prevention
strictDepBuilds: true
blockExoticSubdeps: true

trustPolicy: no-downgrade

overrides:
  'changelogithub>c12': 3.3.4
  semver: 7.7.3

# Explicitly allow build scripts for packages that require them
# (replaces onlyBuiltDependencies)
allowBuilds:
  esbuild: true
  sharp: true
  sqlite3: true
  workerd: true

shellEmulator: true
